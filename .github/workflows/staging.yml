name: Vercel Preview deploy for staging

on:
  push:
    branches:
      - staging

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    environment: Preview
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm add -g vercel@latest

      - name: Validate required Vercel secrets
        run: |
          [[ -n "$VERCEL_TOKEN" ]] || { echo "Missing VERCEL_TOKEN"; exit 1; }
          [[ -n "$VERCEL_ORG_ID" ]] || { echo "Missing VERCEL_ORG_ID"; exit 1; }
          [[ -n "$VERCEL_PROJECT_ID" ]] || { echo "Missing VERCEL_PROJECT_ID"; exit 1; }

      - run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
      - run: vercel deploy --yes --token="$VERCEL_TOKEN"