name: CI

on:
  push:
    branches:
      - main
      - v2
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26.x
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint:ci

      - name: Type check
        run: pnpm run type-check

      - name: Check for exposed secrets in client code
        run: grep -rE "SUPABASE_SERVICE_ROLE_KEY|VITE_SUPABASE|VITE_.*SERVICE_ROLE" ./src || true

      - name: Unit tests
        run: pnpm run test:unit

      - name: Build
        run: pnpm run build
